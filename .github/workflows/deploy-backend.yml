name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: backend
        run: mvn -B clean package

      - name: Upload jar + ecosystem file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend/target/*.jar,backend/ecosystem.config.js'
          target: '/home/ec2-user/deploy-tmp'
          strip_components: 2

      - name: Provision host + deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # --- one-time provisioning, safe to re-run every deploy ---
            command -v java >/dev/null 2>&1 || sudo dnf install -y java-17-amazon-corretto
            command -v node >/dev/null 2>&1 || sudo dnf install -y nodejs npm
            command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2

            mkdir -p /home/ec2-user/newsbook-backend
            mkdir -p /home/ec2-user/deploy-tmp

            if [ ! -f /etc/systemd/system/pm2-ec2-user.service ]; then
              sudo env PATH=$PATH:$(dirname "$(which node)") "$(which pm2)" startup systemd -u ec2-user --hp /home/ec2-user
            fi

            command -v nginx >/dev/null 2>&1 || sudo dnf install -y nginx
            sudo systemctl enable --now nginx

            if [ ! -f /etc/nginx/conf.d/newsbooktech.conf ]; then
              sudo mkdir -p /var/www/newsbook-admin
              sudo tee /etc/nginx/conf.d/newsbooktech.conf > /dev/null <<'NGINX'
            server {
                listen 80;
                server_name newsbooktech.com www.newsbooktech.com;

                location = /privacy {
                    root /var/www/newsbook-admin;
                    try_files /privacy.html =404;
                }

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    client_max_body_size 20M;
                }
            }
            NGINX
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # --- deploy ---
            mv /home/ec2-user/deploy-tmp/ecosystem.config.js /home/ec2-user/newsbook-backend/ecosystem.config.js
            JAR=$(ls -t /home/ec2-user/deploy-tmp/*.jar | head -n1)
            cp "$JAR" /home/ec2-user/newsbook-backend/app.jar
            rm -f /home/ec2-user/deploy-tmp/*.jar

            pm2 startOrRestart /home/ec2-user/newsbook-backend/ecosystem.config.js
            pm2 save
            sleep 2
            pm2 status newsbook-backend

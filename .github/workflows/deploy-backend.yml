name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: backend
        run: mvn -B clean package

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend/target/*.jar'
          target: '/home/ec2-user/deploy-tmp'
          strip_components: 2

      - name: Restart backend via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            JAR=$(ls -t /home/ec2-user/deploy-tmp/*.jar | head -n1)
            mkdir -p /home/ec2-user/newsbook-backend
            cp "$JAR" /home/ec2-user/newsbook-backend/app.jar
            rm -f /home/ec2-user/deploy-tmp/*.jar
            pm2 startOrRestart /home/ec2-user/newsbook-backend/ecosystem.config.js
            pm2 save
            sleep 2
            pm2 status newsbook-backend

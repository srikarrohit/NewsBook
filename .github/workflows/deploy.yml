name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend-admin/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Everything is built here on GitHub's runners; the t4g.nano server (512 MB RAM) only
# receives finished files. EC2_HOST must be the ARM server (Elastic IP 16.112.243.119).

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # zig as the cross-linker: a fully static ARM64 binary, no glibc version coupling.
      - name: Install cargo-zigbuild
        run: pip install ziglang cargo-zigbuild

      - name: Build (ARM64, static)
        working-directory: backend
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          mkdir -p bundle/site
          cp backend/target/aarch64-unknown-linux-musl/release/newsbook-backend bundle/
          cp deploy/systemd/newsbook-backend.service deploy/nginx/newsbooktech.conf bundle/
          cp deploy/website/*.html bundle/site/
          tar czf backend-bundle.tgz -C bundle .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend-bundle.tgz
          target: /home/ec2-user/deploy-tmp

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,APP_AWS_ACCESS_KEY_ID,APP_AWS_SECRET_ACCESS_KEY,GEMINI_API_KEY
          script: |
            set -e
            # Guard: never install an ARM binary on the old x86 server.
            [ "$(uname -m)" = aarch64 ] || { echo "EC2_HOST is not the ARM server ($(uname -m))"; exit 1; }

            STAGE=/home/ec2-user/deploy-tmp/backend
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            tar xzf /home/ec2-user/deploy-tmp/backend-bundle.tgz -C "$STAGE"
            rm -f /home/ec2-user/deploy-tmp/backend-bundle.tgz

            # Runtime config from GitHub secrets. Values are single-quoted so the file
            # reads the same in systemd and when sourced by bash (DATABASE_URL has '&').
            umask 077
            {
              echo "DATABASE_URL='$DATABASE_URL'"
              echo "AWS_ACCESS_KEY_ID='$APP_AWS_ACCESS_KEY_ID'"
              echo "AWS_SECRET_ACCESS_KEY='$APP_AWS_SECRET_ACCESS_KEY'"
              echo "AWS_S3_BUCKET='newsbook-data-hyd'"
              echo "AWS_REGION='ap-south-2'"
              echo "GEMINI_API_KEY='$GEMINI_API_KEY'"
            } > "$STAGE/backend.env"
            sudo install -m 640 -o root -g ec2-user "$STAGE/backend.env" /etc/newsbook/backend.env
            umask 022

            # Public website + API reverse proxy.
            sudo cp "$STAGE"/site/*.html /var/www/newsbook-site/
            sudo cp "$STAGE/newsbooktech.conf" /etc/nginx/conf.d/newsbooktech.conf
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot --nginx -n --agree-tos -m mohandiaries58@gmail.com \
              -d newsbooktech.com -d www.newsbooktech.com --redirect \
              || echo "::warning::certbot failed - is newsbooktech.com pointing at this server yet?"

            # Atomic binary swap, then restart.
            install -m 755 "$STAGE/newsbook-backend" /home/ec2-user/newsbook-backend/newsbook-backend.new
            mv /home/ec2-user/newsbook-backend/newsbook-backend.new /home/ec2-user/newsbook-backend/newsbook-backend
            sudo cp "$STAGE/newsbook-backend.service" /etc/systemd/system/newsbook-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable newsbook-backend
            rm -rf "$STAGE"

            # Until the one-time data import has run (migrate workflow), starting the
            # backend would seed an empty database and block the import.
            if [ ! -f /etc/newsbook/.migrated ]; then
              echo "::warning::Data not migrated yet - backend installed but not started."
              exit 0
            fi
            sudo systemctl restart newsbook-backend
            curl -sf --retry 15 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8080/api/tiles
            systemctl --no-pager --lines=5 status newsbook-backend

  admin-web:
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Build
        working-directory: frontend-admin
        run: npm run build

      - name: Package
        run: |
          mkdir -p bundle/dist
          cp -r frontend-admin/dist/. bundle/dist/
          cp deploy/nginx/admin-newsbooktech.conf bundle/
          tar czf admin-bundle.tgz -C bundle .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: admin-bundle.tgz
          target: /home/ec2-user/deploy-tmp

      - name: Publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            [ "$(uname -m)" = aarch64 ] || { echo "EC2_HOST is not the ARM server ($(uname -m))"; exit 1; }
            STAGE=/home/ec2-user/deploy-tmp/admin
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            tar xzf /home/ec2-user/deploy-tmp/admin-bundle.tgz -C "$STAGE"
            rm -f /home/ec2-user/deploy-tmp/admin-bundle.tgz

            # nginx serves the built files directly - no Node process on the server.
            sudo rsync -a --delete "$STAGE/dist/" /var/www/newsbook-admin/
            sudo cp "$STAGE/admin-newsbooktech.conf" /etc/nginx/conf.d/admin-newsbooktech.conf
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot --nginx -n --agree-tos -m mohandiaries58@gmail.com \
              -d admin.newsbooktech.com --redirect \
              || echo "::warning::certbot failed - is admin.newsbooktech.com pointing at this server yet?"
            rm -rf "$STAGE"

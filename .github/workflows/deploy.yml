name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend-admin/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: backend
        run: mvn -B clean package

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend/target/*.jar'
          target: '/home/ec2-user/deploy-tmp'
          strip_components: 2

      - name: Upload ecosystem file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend/ecosystem.config.js'
          target: '/home/ec2-user/deploy-tmp'
          strip_components: 1

      - name: Upload nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'deploy/nginx/newsbooktech.conf'
          target: '/home/ec2-user/deploy-tmp'
          strip_components: 2

      - name: Run with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            command -v nginx >/dev/null 2>&1 || sudo dnf install -y nginx
            sudo systemctl enable --now nginx
            sudo cp /home/ec2-user/deploy-tmp/newsbooktech.conf /etc/nginx/conf.d/newsbooktech.conf
            rm -f /home/ec2-user/deploy-tmp/newsbooktech.conf
            sudo nginx -t && sudo systemctl reload nginx

            command -v certbot >/dev/null 2>&1 || {
              sudo dnf install -y python3 augeas-libs
              sudo python3 -m venv /opt/certbot
              sudo /opt/certbot/bin/pip install --upgrade pip
              sudo /opt/certbot/bin/pip install certbot certbot-nginx
              sudo ln -sf /opt/certbot/bin/certbot /usr/bin/certbot
            }
            sudo certbot --nginx -n --agree-tos -m mohandiaries58@gmail.com \
              -d newsbooktech.com -d www.newsbooktech.com --redirect

            mkdir -p /home/ec2-user/newsbook-backend
            mv /home/ec2-user/deploy-tmp/ecosystem.config.js /home/ec2-user/newsbook-backend/ecosystem.config.js
            JAR=$(ls -t /home/ec2-user/deploy-tmp/*.jar | head -n1)
            cp "$JAR" /home/ec2-user/newsbook-backend/app.jar
            rm -f /home/ec2-user/deploy-tmp/*.jar
            pm2 startOrRestart /home/ec2-user/newsbook-backend/ecosystem.config.js
            pm2 save
            sleep 2
            pm2 status newsbook-backend

  admin-web:
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Build
        working-directory: frontend-admin
        run: npm run build

      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'frontend-admin/dist/*'
          target: '/home/ec2-user/deploy-tmp-admin'
          strip_components: 2

      - name: Upload ecosystem file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'frontend-admin/ecosystem.config.js'
          target: '/home/ec2-user/deploy-tmp-admin'
          strip_components: 1

      - name: Upload nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'deploy/nginx/admin-newsbooktech.conf'
          target: '/home/ec2-user/deploy-tmp-admin'
          strip_components: 2

      - name: Run with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            command -v nginx >/dev/null 2>&1 || sudo dnf install -y nginx
            sudo systemctl enable --now nginx
            sudo cp /home/ec2-user/deploy-tmp-admin/admin-newsbooktech.conf /etc/nginx/conf.d/admin-newsbooktech.conf
            rm -f /home/ec2-user/deploy-tmp-admin/admin-newsbooktech.conf
            sudo nginx -t && sudo systemctl reload nginx

            command -v certbot >/dev/null 2>&1 || {
              sudo dnf install -y python3 augeas-libs
              sudo python3 -m venv /opt/certbot
              sudo /opt/certbot/bin/pip install --upgrade pip
              sudo /opt/certbot/bin/pip install certbot certbot-nginx
              sudo ln -sf /opt/certbot/bin/certbot /usr/bin/certbot
            }
            sudo certbot --nginx -n --agree-tos -m mohandiaries58@gmail.com \
              -d admin.newsbooktech.com --redirect

            command -v serve >/dev/null 2>&1 || sudo npm install -g serve

            mkdir -p /home/ec2-user/newsbook-admin-web
            mv /home/ec2-user/deploy-tmp-admin/ecosystem.config.js /home/ec2-user/newsbook-admin-web/ecosystem.config.js

            rm -rf /home/ec2-user/newsbook-admin-web/dist
            mkdir -p /home/ec2-user/newsbook-admin-web/dist
            mv /home/ec2-user/deploy-tmp-admin/* /home/ec2-user/newsbook-admin-web/dist/
            rm -rf /home/ec2-user/deploy-tmp-admin/*

            pm2 startOrRestart /home/ec2-user/newsbook-admin-web/ecosystem.config.js
            pm2 save
            sleep 2
            pm2 status newsbook-admin-web

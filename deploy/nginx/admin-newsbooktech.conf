server {
    listen 80;
    server_name admin.newsbooktech.com;

    # The admin web app's built files, served directly by nginx (no Node on the server).
    root /var/www/newsbook-admin;

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
